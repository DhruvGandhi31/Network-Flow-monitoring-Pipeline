[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netflow-sentry"
version = "0.1.0"
description = "Distributed network flow monitoring pipeline: gRPC agents -> collector -> Prometheus/Grafana."
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.65",
  "protobuf>=5.27",
  "psutil>=6.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.65",
  "pytest>=8.0",
  "ruff>=0.5",
]
aws = [
  "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

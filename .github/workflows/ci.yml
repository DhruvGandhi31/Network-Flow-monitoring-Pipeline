name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Generate protobuf/gRPC stubs
        run: python scripts/generate_proto.py

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -v

  build-images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build collector image
        run: docker build -f docker/collector.Dockerfile -t netflow-sentry-collector:ci .

      - name: Build agent image
        run: docker build -f docker/agent.Dockerfile -t netflow-sentry-agent:ci .
